server:
  port: 8080

spring:
  application:
    name: hotel-gateway

  cloud:
    gateway:
      routes:
        - id: hotel-supply-service
          uri: http://localhost:8101
          predicates:
            - Path=/api/supply/**
          filters:
            - StripPrefix=1

        - id: hotel-guide-service
          uri: http://localhost:8102
          predicates:
            - Path=/api/guide/**
          filters:
            - StripPrefix=1


        - id: hotel-checkout-service
          uri: http://localhost:8103
          predicates:
            - Path=/api/checkout/**
          filters:
            - StripPrefix=1


        - id: hotel-trade-service
          uri: http://localhost:8104
          predicates:
            - Path=/api/trade/**
          filters:
            - StripPrefix=1
        - id: hotel-admin-service
          uri: http://localhost:8107
          predicates:
            - Path=/api/admin/**
          filters:
            - StripPrefix=1
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,threaddump
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
logging:
  level:
    root: info
    com.hotel: debug